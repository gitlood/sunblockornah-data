name: UV pipeline
# Every 3 h a cheap check decides whether to run the full CAMS job: a newer CAMS run is
# expected, the city list changed, or `force` is set. A skipped cron self-heals on the next tick.
# Runs only on schedule / manual dispatch: fork PRs never reach the secrets.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run the full job and republish even if nothing looks new"
        type: boolean
        default: false
permissions: {}
concurrency:
  group: uv-pipeline
  cancel-in-progress: false
jobs:
  build:
    # Read-only token. Runs the gate and the CAMS job (the only step with secrets).
    if: github.repository == 'gitlood/sunblockornah-data'
    runs-on: ubuntu-latest
    # CAMS queue wait is capped at 40 min per attempt (fetch.py); 3 attempts with 15 min
    # pauses fit in 150 min. A stuck run is killed and the next 3 h tick retries.
    timeout-minutes: 150
    permissions:
      contents: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Fetch published data (gh-pages; main's v1/ until gh-pages exists)
        env:
          REPO: ${{ github.repository }}
        run: |
          if git ls-remote --exit-code --heads "https://github.com/$REPO.git" gh-pages >/dev/null; then
            git clone -q --depth 1 --branch gh-pages "https://github.com/$REPO.git" "$RUNNER_TEMP/published"
          else
            mkdir "$RUNNER_TEMP/published"; [ ! -d v1 ] || cp -R v1 "$RUNNER_TEMP/published/"
          fi
          rm -rf "$RUNNER_TEMP/published/.git"
      - name: Gate
        id: gate
        env:
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then F=--force; else F=; fi
          cd pipeline && python3 -m uvpipe.check --out "$RUNNER_TEMP/published" $F
      - name: Install (hash-pinned, no secrets)
        if: steps.gate.outputs.run == 'true'
        run: python3 -m pip install -q --require-hashes -r pipeline/requirements.txt
      - name: Run CAMS job
        if: steps.gate.outputs.run == 'true'
        env:
          CDSAPI_URL: ${{ secrets.CDSAPI_URL }}
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
          FORCE: ${{ inputs.force }}
        run: OUT="$RUNNER_TEMP/published" pipeline/publish.sh
      - name: Upload data files only
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: data
          path: |
            ${{ runner.temp }}/published/v1/cities.json
            ${{ runner.temp }}/published/v1/grid.json
            ${{ runner.temp }}/published/README.md
            ${{ runner.temp }}/published/.nojekyll
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  publish:
    # Write token, no secrets, no pip, no Python: only git and the uploaded data files.
    needs: build
    if: needs.build.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          path: code
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: data
          path: ${{ runner.temp }}/data
      - name: Arrange data files (fixed names only)
        run: |
          D="$RUNNER_TEMP/data"; P="$RUNNER_TEMP/pub"
          mkdir -p "$P/v1"
          find "$D" -type f
          cp "$D/v1/cities.json" "$D/v1/grid.json" "$P/v1/"
          cp "$D/README.md" "$D/.nojekyll" "$P/"
      - name: Orphan commit and force-push gh-pages
        working-directory: ${{ runner.temp }}/pub
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: "$GITHUB_WORKSPACE/code/pipeline/push.sh"
