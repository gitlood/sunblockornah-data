name: UV pipeline
# Every 3 h a cheap check decides whether to run the full CAMS job: a newer CAMS run is
# expected, the city list changed, or `force` is set. A skipped cron self-heals on the next tick.
# Runs only on schedule / manual dispatch: fork PRs never reach the secrets.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run the full job and republish even if nothing looks new"
        type: boolean
        default: false
permissions: {}
concurrency:
  group: uv-pipeline
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'gitlood/sunblockornah-data'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Gate
        id: gate
        env:
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then F=--force; else F=; fi
          cd pipeline && python3 -m uvpipe.check --out .. $F
      - name: Install (hash-pinned, no secrets)
        if: steps.gate.outputs.run == 'true'
        run: python3 -m pip install -q --require-hashes -r pipeline/requirements.txt
      - name: Run CAMS job
        if: steps.gate.outputs.run == 'true'
        env:
          CDSAPI_URL: ${{ secrets.CDSAPI_URL }}
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
          FORCE: ${{ inputs.force }}
        run: pipeline/publish.sh
      - name: Commit and push data
        if: steps.gate.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pipeline/push.sh
